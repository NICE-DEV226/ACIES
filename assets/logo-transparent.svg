  <line x1="256" y1="80" x2="256" y2="130" stroke="#CE422B" stroke-width="3" opacity="0.4"/>
  <line x1="400" y1="160" x2="360" y2="185" stroke="#CE422B" stroke-width="3" opacity="0.4"/>
  <line x1="400" y1="320" x2="360" y2="315" stroke="#CE422B" stroke-width="3" opacity="0.4"/>
  <line x1="256" y1="400" x2="256" y2="370" stroke="#CE422B" stroke-width="3" opacity="0.4"/>
  <line x1="112" y1="320" x2="152" y2="315" stroke="#CE422B" stroke-width="3" opacity="0.4"/>
  <line x1="112" y1="160" x2="152" y2="185" stroke="#CE422B" stroke-width="3" opacity="0.4"/>

  <!-- Text -->
  <text x="256" y="460" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace"
