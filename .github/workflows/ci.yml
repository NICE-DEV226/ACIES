name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Python Tests
  # ─────────────────────────────────────────────
  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: python3 test_apc.py

  # ─────────────────────────────────────────────
  # Job 2: Go Build & Test
  # ─────────────────────────────────────────────
  build-go:
    name: 🔨 Go Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build CLI
        run: go build -o acies-cli .

      - name: Run CLI version
        run: ./acies-cli version

      - name: Run CLI benchmark
        run: ./acies-cli bench --iterations 1000

  # ─────────────────────────────────────────────
  # Job 3: C++ Build
  # ─────────────────────────────────────────────
  build-cpp:
    name: 🔧 C++ Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y g++ make

      - name: Build library
        run: cd cpp && make

      - name: Verify library
        run: ls -la cpp/libacies.so

  # ─────────────────────────────────────────────
  # Job 4: Benchmark (on main only)
  # ─────────────────────────────────────────────
  benchmark:
    name: 📊 Benchmark
    runs-on: ubuntu-latest
    needs: [test, build-go, build-cpp]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build Go CLI
        run: go build -o acies-cli .

      - name: Run Python benchmark
        run: python3 examples/benchmark.py

      - name: Run Go benchmark
        run: ./acies-cli bench --iterations 5000

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmark_*.csv
            benchmark_*.json

  # ─────────────────────────────────────────────
  # Job 5: Publish to PyPI (on release)
  # ─────────────────────────────────────────────
  publish:
    name: 📦 Publish to PyPI
    runs-on: ubuntu-latest
    needs: [test, build-go, build-cpp]
    if: github.event_name == 'release'
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  # ─────────────────────────────────────────────
  # Job 6: Create GitHub Release assets
  # ─────────────────────────────────────────────
  release-assets:
    name: 📋 Release Assets
    runs-on: ubuntu-latest
    needs: [test, build-go, build-cpp]
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Go binary (Linux)
        run: GOOS=linux GOARCH=amd64 go build -o acies-cli-linux-amd64 .

      - name: Build Go binary (macOS)
        run: GOOS=darwin GOARCH=amd64 go build -o acies-cli-darwin-amd64 .

      - name: Build Python wheel
        run: pip install build && python -m build --wheel

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            acies-cli-linux-amd64
            acies-cli-darwin-amd64
            dist/*.whl
